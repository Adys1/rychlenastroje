<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070719">
  <title>Kontakt — Rychlé nástroje</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap&subset=latin-ext" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f5f2ff;background:radial-gradient(ellipse at 84% 8%,#6818a655 0,transparent 32%),radial-gradient(ellipse at 100% 35%,#02d4f329 0,transparent 28%),#070719;font-family:Manrope,"Avenir Next",Avenir,system-ui,sans-serif}.page{max-width:1120px;margin:auto;padding:24px 36px 60px}.topbar{height:52px;border-bottom:1px solid #ffffff16;display:flex;align-items:flex-start;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;color:inherit;text-decoration:none}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;overflow:hidden}.mark img{width:34px;height:34px;display:block}.back{color:#dcd5f5;text-decoration:none;font-size:12px;font-weight:650;border:1px solid #ffffff27;border-radius:30px;padding:9px 14px;background:#ffffff08}.back:hover{border-color:#83eaff}.language-picker{height:36px;display:flex;align-items:center;gap:5px;margin-left:auto;margin-right:10px;padding:0 9px;border:1px solid #ffffff27;border-radius:30px;background:#ffffff08;color:#f2edff}.language-picker span{font-size:13px}.language-picker select{max-width:125px;border:0;outline:0;background:transparent;color:inherit;font-family:inherit;font-size:10px;font-weight:650;cursor:pointer}.language-picker option{background:#17152b;color:#fff}.content{max-width:760px;margin:86px auto 0}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#68dff7;font-weight:800}.title{font-size:clamp(36px,7vw,62px);letter-spacing:-2.5px;line-height:1.04;margin:12px 0;background:linear-gradient(100deg,#fff,#d9ceff 65%,#79e7ff);color:transparent;background-clip:text}.lead{color:#aaa7c5;font-size:15px;line-height:1.7;max-width:540px;margin:14px 0 34px}.contact-card{border:1px solid #ffffff20;border-radius:22px;background:linear-gradient(145deg,#17152fe8,#101023ed);box-shadow:0 24px 70px #0006,inset 0 1px #ffffff0a;padding:30px;display:grid;grid-template-columns:112px 1fr;gap:25px;align-items:start}.avatar{width:104px;height:104px;border-radius:28px;display:grid;place-items:center;font-size:35px;font-weight:800;color:white;overflow:hidden;box-shadow:0 12px 30px #812de24a}.avatar img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 24%}.profile-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#8e89a9;margin:3px 0 7px}.name{font-size:clamp(24px,4vw,34px);letter-spacing:-1px;margin:0 0 22px}.details{display:grid;grid-template-columns:1fr;gap:12px}.detail{min-height:66px;border:1px solid #ffffff13;border-radius:12px;background:#ffffff06;padding:13px}.detail-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#8e89a9;margin-bottom:6px}.detail-value{font-size:12px;color:#dcd7ee;overflow-wrap:anywhere}.detail a{color:#a8eaff;text-decoration:none}.detail a:hover{text-decoration:underline}.footer{text-align:center;color:#77728e;font-size:10px;margin:34px 0 0}@media(max-width:600px){.page{padding:16px}.content{margin-top:58px}.contact-card{padding:20px;grid-template-columns:1fr}.avatar{width:76px;height:76px;border-radius:22px;font-size:27px}.details{grid-template-columns:1fr}.lead{font-size:13px}}
    .language-menu{position:relative;margin-left:auto}.language-toggle{height:36px;display:flex;align-items:center;gap:6px;padding:0 10px;border:1px solid #ffffff27;border-radius:30px;background:#ffffff08;color:#f2edff;font:650 10px Manrope,"Avenir Next",Avenir,system-ui,sans-serif;cursor:pointer}.language-toggle:hover,.language-toggle:focus-visible{border-color:#83eaff;outline:none}.language-toggle .language-current{white-space:nowrap}.language-options{position:absolute;z-index:40;right:0;top:calc(100% + 8px);width:180px;padding:6px;border:1px solid #ffffff2c;border-radius:13px;background:linear-gradient(145deg,#211b3c,#111124);box-shadow:0 16px 40px #000a}.language-options[hidden]{display:none}.language-options button{display:flex;width:100%;align-items:center;gap:9px;border:0;border-radius:8px;padding:9px 10px;background:transparent;color:#eeeaff;text-align:left;font:600 11px Manrope,"Avenir Next",Avenir,system-ui,sans-serif;cursor:pointer}.language-options button:hover,.language-options button[aria-current="true"]{background:#ffffff12;color:#fff}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar"><a class="brand" href="index.html"><span class="mark"><img src="logo.svg" alt=""></span> Rychlé nástroje</a><a class="back" href="index.html">← Zpět k losování</a><div class="language-menu"><button class="language-toggle" id="languageToggle" type="button" aria-label="Vybrat jazyk" aria-expanded="false" aria-controls="languageOptions"><span aria-hidden="true">🌐</span><span class="language-current" id="languageCurrent">Čeština</span><span aria-hidden="true">⌄</span></button><div class="language-options" id="languageOptions" hidden><button type="button" data-language="cs">🇨🇿 Čeština</button><button type="button" data-language="en">🇬🇧 English</button><button type="button" data-language="de">🇩🇪 Deutsch</button><button type="button" data-language="pl">🇵🇱 Polski</button><button type="button" data-language="sk">🇸🇰 Slovenčina</button></div></div></header>
    <section class="content">
      <div class="eyebrow">Kontakt</div>
      <h1 class="title">Pojďme být v kontaktu</h1>
      <p class="lead">Máte otázku nebo nápad? Napište mi — rád se ozvu zpět.</p>
      <article class="contact-card">
        <div class="avatar"><img src="assets/adam-schauer.png" alt="Adam Schauer"></div>
        <div><div class="profile-label">Kontakt</div><h2 class="name">Adam Schauer</h2>
          <div class="details">
            <div class="detail"><div class="detail-label">E-mail</div><div class="detail-value"><a href="mailto:jsem@adamschauer.cz">jsem@adamschauer.cz</a></div></div>
          </div>
        </div>
      </article>
      <div class="footer">Rychlé nástroje · nástroje pro každodenní život</div>
    </section>
  </main>
  <script src="language.js"></script>
</body>
</html>
